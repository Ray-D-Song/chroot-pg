name: Build, verify, and release chroot-pg

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Create a GitHub Release after all checks pass
        required: false
        type: boolean
        default: false
      tag:
        description: Existing tag to publish when release is selected
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Debian 12 rootfs and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y debootstrap gnupg
      - name: Validate manual release input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          test -n '${{ inputs.tag }}'
          case '${{ inputs.tag }}' in v*) ;; *) echo 'manual release tag must start with v' >&2; exit 1;; esac
      - name: Build rootfs
        run: sudo -E bash scripts/build-rootfs.sh
      - name: Verify rootfs
        run: sudo bash tests/verify-rootfs.sh build/rootfs
      - name: Create offline package
        run: sudo bash scripts/package.sh "${{ inputs.tag || github.ref_name }}"
      - name: Verify package integrity
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          tar -tzf dist/chroot-pg-*-linux-amd64.tar.gz | grep -E '/rootfs/usr/lib/postgresql/17/bin/postgres$'
      - uses: actions/upload-artifact@v4
        with:
          name: chroot-pg-release
          path: dist/
          if-no-files-found: error

  verify-centos7-kernel310:
    name: Verify on self-hosted CentOS 7 / kernel 3.10
    needs: build
    runs-on: [self-hosted, linux, x64, centos7-kernel310]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: chroot-pg-release
          path: dist
      - name: Validate required host capabilities
        run: |
          test "$(uname -m)" = x86_64
          [[ "$(uname -r)" == 3.10.* ]]
          command -v systemctl
          sudo -n true
      - name: Verify package checksum
        run: (cd dist && sha256sum --check SHA256SUMS)
      - name: Run real service smoke test
        run: sudo -E bash tests/smoke-test.sh "$(find dist -name 'chroot-pg-*-linux-amd64.tar.gz' -print -quit)" "$GITHUB_RUN_ID"

  verify-ubuntu24:
    name: Verify on Ubuntu 24.04
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: chroot-pg-release
          path: dist
      - name: Validate required host capabilities
        run: |
          test "$(uname -m)" = x86_64
          command -v systemctl
          sudo -n true
      - name: Verify package checksum
        run: (cd dist && sha256sum --check SHA256SUMS)
      - name: Run real service smoke test
        run: sudo -E bash tests/smoke-test.sh "$(find dist -name 'chroot-pg-*-linux-amd64.tar.gz' -print -quit)" "$GITHUB_RUN_ID"

  release:
    name: Create GitHub Release
    needs: [verify-ubuntu24, verify-centos7-kernel310]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chroot-pg-release
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test -n "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/chroot-pg-*-linux-amd64.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/chroot-pg-*-linux-amd64.tar.gz dist/SHA256SUMS \
              --title "chroot-pg $RELEASE_TAG" --generate-notes
          fi

  cleanup-artifacts:
    name: Remove artifacts from non-release or failed runs
    needs: [build, verify-ubuntu24, verify-centos7-kernel310, release]
    if: >-
      ${{
        always() &&
        (
          needs.build.result != 'success' ||
          needs.verify-ubuntu24.result != 'success' ||
          needs.verify-centos7-kernel310.result != 'success' ||
          needs.release.result == 'failure' ||
          needs.release.result == 'cancelled' ||
          !(
            startsWith(github.ref, 'refs/tags/v') ||
            (github.event_name == 'workflow_dispatch' && inputs.release)
          )
        )
      }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete artifacts created by this failed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[].id' |
            while read -r artifact_id; do
              test -n "$artifact_id" || continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
              echo "Deleted artifact $artifact_id from failed run $GITHUB_RUN_ID"
            done
